name: Build

# 触发条件：主干分支的推送、PR、打标签、以及手动触发
# 打 v* 标签时会额外把 Release 产物打包发布到 GitHub Release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'release/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'release/**'
  workflow_dispatch:

# 最小权限：CI 只需要读代码
permissions:
  contents: read

# 同一分支的新推送取消上一次未完成的构建，节省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.config }} (x64)
    runs-on: windows-latest   # 自带 MSVC + Windows SDK + CMake + Ninja
    timeout-minutes: 40
    strategy:
      fail-fast: false        # Debug 失败时也要看到 Release 的结果
      matrix:
        config: [Release, Debug]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ImGui / MinHook 由 CMake 的 FetchContent 在 configure 阶段从 GitHub 拉取，
      # 缓存 build/_deps 可以把每次 CI 的克隆时间降到接近 0。
      # 不写 restore-keys：CMakeLists.txt 改了依赖版本就必须重新拉取，避免用陈旧副本。
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build\_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt') }}

      # 不写死 "-G Visual Studio 17 2022"：那个生成器名和 VS 版本强绑定，
      # runner 镜像换成别的 VS 版本就会报 "could not find any instance of Visual Studio"。
      # 这里用 vswhere 找任意版本的 MSVC，再靠 vcvars64 + Ninja 构建，与 VS 版本无关。
      - name: Set up MSVC toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }

          $vs = & $vswhere -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                  -property installationPath
          if (-not $vs) { throw "No Visual Studio instance with the C++ toolset found." }
          Write-Host "Visual Studio : $vs"
          Write-Host "vswhere       : $(& $vswhere -latest -property installationVersion)"

          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }

          # vcvars64 只能改它自己那个 cmd 进程的环境，所以把 set 的结果导给后续步骤用。
          $env_lines = cmd /c "`"$vcvars`" >nul 2>&1 && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed with exit code $LASTEXITCODE" }
          $env_lines |
            Where-Object { $_ -match '^[A-Za-z_][A-Za-z0-9_()]*=' } |
            Add-Content -Path $env:GITHUB_ENV -Encoding utf8

          # Ninja 优先用 PATH 上的，没有就用 VS 自带的那份。
          $ninja = (Get-Command ninja -ErrorAction SilentlyContinue).Source
          if (-not $ninja) {
            $candidate = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe'
            if (Test-Path $candidate) { $ninja = $candidate }
          }
          if (-not $ninja) { throw "ninja not found on PATH or in the VS installation." }
          Write-Host "ninja         : $ninja ($(& $ninja --version))"
          "CMAKE_MAKE_PROGRAM=$ninja" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          Write-Host "cmake         : $(& cmake --version | Select-Object -First 1)"

      - name: Configure (CMake + Ninja)
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_MAKE_PROGRAM="$env:CMAKE_MAKE_PROGRAM"
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --parallel

      # 单配置生成器（Ninja）的产物直接落在 build/bin/；
      # 若以后换回多配置生成器会落到 build/bin/<Config>/，这里按文件搜索两种布局都不会误报。
      - name: Verify artifacts
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'build\bin'
          $exe = Get-ChildItem $root -Recurse -Filter HeapExplorer.exe -File -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Error "No HeapExplorer.exe under $root"
            exit 1
          }
          $bin = $exe.Directory.FullName
          Write-Host "Artifact directory: $bin"

          $missing = @()
          foreach ($f in 'HeapExplorer.exe', 'launcher.exe', 'worker.dll') {
            if (Test-Path (Join-Path $bin $f)) { Write-Host "OK   $f" }
            else { Write-Host "MISS $f"; $missing += $f }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Build produced no $($missing -join ', ') in $bin"
            exit 1
          }

          Write-Host ''
          Get-ChildItem $bin -File | Get-FileHash -Algorithm SHA256 |
            Format-Table Hash, Path -AutoSize

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HeapExplorer-${{ matrix.config }}-x64
          path: build\bin\
          if-no-files-found: error
          # Debug 包只在需要时保留 3 天，Release 包留 30 天
          retention-days: ${{ matrix.config == 'Release' && 30 || 3 }}

  # 打 v* 标签时，把上面已经构建好的 Release 产物打成 zip 挂到 GitHub Release。
  # 不重新编译：直接复用 build 矩阵里 Release 那条腿上传的 artifact。
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write      # 创建 Release 需要写权限（其它 job 仍只有 read）
    steps:
      - name: Checkout (README 一并打进包)
        uses: actions/checkout@v4

      - name: Download Release build
        uses: actions/download-artifact@v4
        with:
          name: HeapExplorer-Release-x64
          path: dist

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "HeapExplorer-$tag-win-x64.zip"
          Copy-Item README.md dist\README.md

          # SHA256SUMS 覆盖所有上传的资产：三个裸文件 + zip，方便逐个校验
          $sums = foreach ($f in 'HeapExplorer.exe', 'launcher.exe', 'worker.dll') {
            $h = (Get-FileHash (Join-Path dist $f) -Algorithm SHA256).Hash.ToLower()
            "$h  $f"
          }
          Compress-Archive -Path dist\* -DestinationPath $zip -Force
          $sums += "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  $zip"
          $sums | Set-Content SHA256SUMS.txt -Encoding ascii

          Get-Content SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length -AutoSize

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 已有同名 Release 就只补传资产，避免重跑时 gh release create 报错
          gh release view $env:TAG -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG -R $env:GITHUB_REPOSITORY --title $env:TAG --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # 三个二进制裸传 + zip + 校验和（gh 用文件名作为资产名）
          gh release upload $env:TAG `
            (Join-Path 'dist' 'HeapExplorer.exe') `
            (Join-Path 'dist' 'launcher.exe') `
            (Join-Path 'dist' 'worker.dll') `
            "HeapExplorer-$env:TAG-win-x64.zip" `
            SHA256SUMS.txt `
            -R $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
